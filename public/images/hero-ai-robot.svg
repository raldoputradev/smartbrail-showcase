<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" fill="none" role="img" aria-label="AI Robot SIMALAS">
  <defs>
    <linearGradient id="bodyGrad" x1="120" y1="80" x2="360" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="160" y1="120" x2="320" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2563eb" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Antenna -->
  <circle cx="240" cy="42" r="14" fill="url(#accentGrad)"/>
  <rect x="236" y="42" width="8" height="36" rx="4" fill="#64748b"/>
  <!-- Head -->
  <rect x="130" y="78" width="220" height="170" rx="42" fill="url(#bodyGrad)" filter="url(#softShadow)"/>
  <rect x="155" y="108" width="170" height="110" rx="28" fill="url(#faceGrad)" stroke="#93c5fd" stroke-width="3"/>
  <!-- Eyes -->
  <ellipse cx="195" cy="158" rx="22" ry="26" fill="#0f172a"/>
  <ellipse cx="285" cy="158" rx="22" ry="26" fill="#0f172a"/>
  <circle cx="202" cy="150" r="8" fill="#22d3ee"/>
  <circle cx="292" cy="150" r="8" fill="#22d3ee"/>
  <!-- Smile panel -->
  <rect x="175" y="188" width="130" height="8" rx="4" fill="#38bdf8" opacity="0.7"/>
  <rect x="190" y="204" width="100" height="6" rx="3" fill="#94a3b8" opacity="0.5"/>
  <!-- Body -->
  <rect x="105" y="260" width="270" height="190" rx="48" fill="url(#bodyGrad)" filter="url(#softShadow)"/>
  <rect x="145" y="300" width="190" height="110" rx="24" fill="#eff6ff" stroke="#bfdbfe" stroke-width="3"/>
  <!-- Core -->
  <circle cx="240" cy="355" r="34" fill="url(#accentGrad)" opacity="0.95"/>
  <path d="M240 335v40M220 355h40" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <!-- Arms -->
  <rect x="48" y="290" width="44" height="120" rx="22" fill="#3b82f6"/>
  <rect x="388" y="290" width="44" height="120" rx="22" fill="#3b82f6"/>
  <circle cx="70" cy="420" r="26" fill="#2563eb"/>
  <circle cx="410" cy="420" r="26" fill="#2563eb"/>
  <!-- Legs -->
  <rect x="155" y="450" width="70" height="52" rx="20" fill="#1e40af"/>
  <rect x="255" y="450" width="70" height="52" rx="20" fill="#1e40af"/>
  <!-- IoT dots -->
  <circle cx="170" cy="330" r="6" fill="#22c55e"/>
  <circle cx="310" cy="330" r="6" fill="#f59e0b"/>
  <circle cx="240" cy="410" r="6" fill="#a78bfa"/>
</svg>
