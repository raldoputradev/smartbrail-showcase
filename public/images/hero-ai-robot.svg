<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img" aria-label="Asisten AI SmartBrail">
  <defs>
    <radialGradient id="orbGlow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.45" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="botShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2563eb" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Orbit rings -->
  <circle cx="100" cy="102" r="72" stroke="url(#ringGrad)" stroke-width="1.6" stroke-dasharray="6 8" opacity="0.7"/>
  <circle cx="100" cy="102" r="86" stroke="url(#ringGrad)" stroke-width="1" stroke-dasharray="2 10" opacity="0.4"/>

  <!-- Orb body -->
  <g filter="url(#botShadow)">
    <circle cx="100" cy="102" r="56" fill="url(#orbGlow)"/>
    <ellipse cx="100" cy="86" rx="34" ry="18" fill="#fff" opacity="0.14"/>
  </g>

  <!-- Face -->
  <g>
    <rect x="66" y="82" width="68" height="42" rx="21" fill="#0b1739" opacity="0.55"/>
    <circle cx="85" cy="103" r="7.5" fill="#e0f2fe"/>
    <circle cx="115" cy="103" r="7.5" fill="#e0f2fe"/>
    <circle cx="87" cy="101" r="2.6" fill="#0284c7"/>
    <circle cx="117" cy="101" r="2.6" fill="#0284c7"/>
    <path d="M92 114c2.4 3.6 5.2 5.4 8 5.4s5.6-1.8 8-5.4" stroke="#bae6fd" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Antenna -->
  <path d="M100 46v-16" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"/>
  <circle cx="100" cy="26" r="6" fill="url(#chipGrad)"/>
  <circle cx="100" cy="26" r="11" stroke="#67e8f9" stroke-width="1.5" opacity="0.5"/>

  <!-- Floating data chips -->
  <g opacity="0.95">
    <rect x="18" y="66" width="26" height="14" rx="7" fill="#0f2a5c" stroke="#38bdf8" stroke-width="1"/>
    <path d="M24 71h6m4 0h4" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"/>
    <rect x="156" y="58" width="26" height="14" rx="7" fill="#0f2a5c" stroke="#818cf8" stroke-width="1"/>
    <path d="M162 65l4 4m0-4l-4 4" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round"/>
    <rect x="150" y="140" width="30" height="14" rx="7" fill="#0f2a5c" stroke="#22d3ee" stroke-width="1"/>
    <path d="M157 147h7m4 0h6" stroke="#67e8f9" stroke-width="2" stroke-linecap="round"/>
    <rect x="22" y="132" width="26" height="14" rx="7" fill="#0f2a5c" stroke="#a78bfa" stroke-width="1"/>
    <circle cx="30" cy="139" r="2.4" fill="#c4b5fd"/>
    <circle cx="38" cy="139" r="2.4" fill="#c4b5fd"/>
  </g>

  <!-- Sparkles -->
  <path d="M52 40l2.2 6 6 2.2-6 2.2-2.2 6-2.2-6-6-2.2 6-2.2z" fill="#7dd3fc"/>
  <path d="M150 30l1.7 4.6 4.6 1.7-4.6 1.7-1.7 4.6-1.7-4.6-4.6-1.7 4.6-1.7z" fill="#a5b4fc"/>
  <circle cx="166" cy="108" r="3" fill="#67e8f9"/>
  <circle cx="36" cy="108" r="2.4" fill="#93c5fd"/>
</svg>
